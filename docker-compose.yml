version: '3.8'

services:
  # --- DATABASE: PostgreSQL with Vector Support ---
  db:
    image: pgvector/pgvector:pg16
    container_name: examinai-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: ${DB_NAME:-examinai_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - examinai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-examinai_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- CACHE & QUEUE: Redis 7 ---
  redis:
    image: redis:7-alpine
    container_name: examinai-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - examinai-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- STORAGE: MinIO (S3-Compatible Local Storage) ---
  minio:
    image: minio/minio:latest
    container_name: examinai-minio
    restart: always
    ports:
      - "9000:9000"       # S3 API
      - "9001:9001"       # MinIO Console dashboard
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin_secret}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - examinai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  examinai-network:
    driver: bridge
